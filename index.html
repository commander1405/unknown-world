<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="UNKNOWN WORLD — 2D Sandbox Survival" />
  <title>UNKNOWN WORLD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="game-root">
    <canvas id="game"></canvas>
    <div id="ui-root"></div>
    <div id="touch-controls" class="hidden">
      <div id="joystick"><div id="joystick-knob"></div></div>
      <button type="button" id="btn-jump" aria-label="Jump">⬆</button>
      <button type="button" id="btn-mine" aria-label="Mine">⛏</button>
      <button type="button" id="btn-place" aria-label="Place">▣</button>
      <button type="button" id="btn-inv" aria-label="Inventory">I</button>
    </div>
    <div id="rotate-hint" class="hidden">Please rotate to landscape / افقی بگیرید</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
